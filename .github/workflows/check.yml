name: check

on:
  pull_request:
  push:
    branches: [main]
  # Release automation dispatches the check on the branches it pushes with the workflow token,
  # whose pushes start no runs of their own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, unit and Chromium
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: format
        run: bun run format:check

      - name: lint
        run: bun run lint

      - name: build
        run: bun run build

      - name: typecheck
        run: bun run typecheck

      - name: unit tests
        run: bun run test

      - name: install Chromium
        run: bun x playwright install --with-deps chromium

      - name: browser tests
        run: bun run test:browser
        env:
          CI: "true"

      - name: starter
        run: bun run starter:check

      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/*/playwright-report
          if-no-files-found: ignore
